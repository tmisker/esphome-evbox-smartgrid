# UNTESTED AND UNPROVEN - USE ENTIRELY AT YOUR OWN RISK.
# Read the disclaimer in README.md and the warnings in docs/installation.md
# before connecting anything to a charger.
#
# EVBox SmartGrid module on an M5Stack AtomS3 Lite with an ATOMIC RS485 Base.
#
# The base takes 6-24 V on its terminal block and powers the Atom from it, so it
# can run from the charger's 12 V if the bus connector provides it. See
# docs/installation.md before connecting anything.

substitutions:
  name: evbox-smartgrid
  friendly_name: EVBox SmartGrid

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atoms3
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret evbox_smartgrid_api_key

ota:
  - platform: esphome
    password: !secret evbox_smartgrid_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

external_components:
  - source: github://tmisker/esphome-evbox-smartgrid
    components: [evbox_smartgrid]

uart:
  id: evbox_bus
  tx_pin: GPIO6
  rx_pin: GPIO5
  baud_rate: 38400
  # The ATOMIC RS485 Base switches direction by itself. Other transceivers may
  # need their DE/RE pin here:
  # flow_control_pin: GPIO7

evbox_smartgrid:
  id: evbox
  # Command 69 is repeated this often; the component never sends more often
  # than the minimum interval the ChargePoint reports.
  update_interval: 15s
  # Without a frame for this long, the ChargePoint switches to fallback_current.
  timeout: 60s
  # Current per phase used when this device, its Wi-Fi or Home Assistant is
  # gone. 16 A keeps charging as if this module was never installed; choose a
  # lower value if a failure must not risk overloading the connection.
  fallback_current: 16

number:
  - platform: template
    id: max_current
    name: Max charging current
    icon: mdi:current-ac
    optimistic: true
    min_value: 0
    max_value: 16
    step: 1
    initial_value: 16
    restore_value: true
    unit_of_measurement: A
    on_value:
      - lambda: id(evbox).set_max_current(x);

switch:
  - platform: template
    name: SmartGrid keep-alive
    icon: mdi:heart-pulse
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(evbox).set_keepalive_enabled(true);
    turn_off_action:
      - lambda: id(evbox).set_keepalive_enabled(false);

sensor:
  - platform: evbox_smartgrid
    current_l1:
      name: Current L1
    current_l2:
      name: Current L2
    current_l3:
      name: Current L3
    power_factor_l1:
      name: Power factor L1
    power_factor_l2:
      name: Power factor L2
    power_factor_l3:
      name: Power factor L3
    energy:
      name: Energy
    minimum_current:
      name: Minimum current
    connection_max_current:
      name: Connection max current
    minimum_interval:
      name: Minimum interval

binary_sensor:
  - platform: evbox_smartgrid
    responding:
      name: ChargePoint responding
